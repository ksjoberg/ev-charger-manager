# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py314"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
    "CPY001", # missing-copyright-notice (stable since ruff 0.16)
    "PLR0917", # too-many-positional-arguments (stable since ruff 0.16)
    # Also ignored by Home Assistant core
    "E501", # line-too-long (handled by the formatter)
    "PLR0912", # too-many-branches
    "PLR0913", # too-many-arguments
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
"tests/**" = [
    "ANN", # type annotations on test functions and helpers
    "D", # docstrings on test functions
    "INP001", # tests/ is not a package
    "N812", # short module aliases (S, P)
    "S101", # pytest uses assert
    "S311", # non-cryptographic random in property tests
]
